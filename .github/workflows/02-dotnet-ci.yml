name: .NET CI

on:
  pull_request:
    paths:
      - "src/**/*.cs"
      - "src/**/*.csproj"
      - "tests/**/*.cs"
      - "tests/**/*.csproj"
      - "*.sln"
      - "*.slnx"
      - "Directory.Build.*"
      - "Directory.Packages.*"
      - "global.json"

jobs:
  build-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger trx
