name: .NET CI

on:
  pull_request:
    paths:
      - "src/BookStudio.OpenCode/AssemblyMarker.cs"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/VS-032-sse-reconciliation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply EOF history predicate repair
        run: python scripts/vs032_patch_eof_history.py
      - name: Commit repaired journey
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/BookStudio.Tests.OpenCodeSseReconciliation/OpenCodeSseReconciliationJourney.cs
          git commit -m "VS-032 observe EOF reconnect and repaired history"
          git push origin HEAD:agent/VS-032-sse-reconciliation
