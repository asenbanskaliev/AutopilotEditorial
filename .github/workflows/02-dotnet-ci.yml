name: .NET CI

on:
  pull_request:
    paths:
      - "src/BookStudio.OpenCode/AssemblyMarker.cs"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/VS-032-sse-reconciliation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded status-cache remediation
        run: python scripts/vs032_bound_status_cache.py
      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/BookStudio.OpenCode/OpenCodeEventReconciler.cs \
            tests/BookStudio.Tests.OpenCodeSseReconciliation/OpenCodeSseReconciliationJourney.cs \
            tests/governance/test_opencode_sse_reconciliation_contract.py \
            docs/evidence/VS-032/AUDIT_REMEDIATION_001.md
          git commit -m "VS-032 bound cumulative session status history"
          git push origin HEAD:agent/VS-032-sse-reconciliation
