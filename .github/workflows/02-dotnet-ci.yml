name: .NET CI

on:
  pull_request:
    paths:
      - "src/BookStudio.OpenCode/AssemblyMarker.cs"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/VS-032-sse-reconciliation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply TCR-032-002
        run: python scripts/vs032_patch_journey.py
      - name: Commit patched journey
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/BookStudio.Tests.OpenCodeSseReconciliation/OpenCodeSseReconciliationJourney.cs
          git commit -m "VS-032 wait for EOF reconnect and poll repair"
          git push origin HEAD:agent/VS-032-sse-reconciliation
