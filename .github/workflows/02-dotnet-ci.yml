name: .NET CI

on:
  pull_request:
    paths:
      - "src/BookStudio.OpenCode/AssemblyMarker.cs"

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/VS-033-agent-tool-profiles
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply VS-033 architecture and CI registration
        run: python scripts/vs033_register.py
      - name: Commit permanent registration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/architecture-policy.json config/ci/providers.json
          git commit -m "VS-033 register agent tool profiles journey"
          git push origin HEAD:agent/VS-033-agent-tool-profiles
