name: .NET CI

on:
  pull_request:
    paths:
      - "src/BookStudio.OpenCode/AssemblyMarker.cs"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/VS-033-agent-tool-profiles
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply value equality and journey marker correction
        run: python scripts/vs033_fix_value_equality.py
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/BookStudio.Application/OpenCode/AgentToolProfileContracts.cs tests/BookStudio.Tests.AgentToolProfiles/AgentToolProfilesJourney.cs
          git commit -m "VS-033 enforce effective profile value equality"
          git push origin HEAD:agent/VS-033-agent-tool-profiles
