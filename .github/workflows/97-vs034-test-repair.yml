name: Apply VS-034 Test Repair
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    if: github.head_ref == 'agent/VS-034-model-benchmarks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Repair valid hard-constraint fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/BookStudio.Tests.ModelBenchmarks/ModelBenchmarksJourney.cs')
          text = path.read_text(encoding='utf-8')
          old = '            ContextWindowTokens = 2_000,\n            BenchmarkEvidence = Evidence(score: 9_900),'
          new = '            ContextWindowTokens = 20_000,\n            BenchmarkEvidence = Evidence(score: 9_900),'
          if old not in text:
              raise SystemExit('Expected hard-constraint fixture not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "bookstudio-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/BookStudio.Tests.ModelBenchmarks/ModelBenchmarksJourney.cs
          git commit -m "fix(VS-034): keep hard-constraint fixture structurally valid"
          git push origin HEAD:${{ github.head_ref }}
