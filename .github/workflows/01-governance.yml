name: Governance Gates

on:
  pull_request:

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_plan_integrity.py
      - run: python scripts/verify_completion.py --pr-mode
      - run: python -m unittest discover -s tests/governance -p "test_*.py" -v
