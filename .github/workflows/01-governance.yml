name: Governance Gates

on:
  pull_request:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_plan_integrity.py
      - run: python scripts/verify_completion.py --pr-mode
      - run: python scripts/validate_ci_providers.py
      - name: Run governance contract tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          python -m unittest discover -s tests/governance -p "test_*.py" -v 2>&1 | tee artifacts/ci/governance-tests.log
      - name: Generate normalized local evidence
        if: always()
        run: |
          mkdir -p artifacts/ci
          python scripts/run_local_validation.py \
            --provider local-evidence-default \
            --contract governance.plan-integrity \
            --source-sha "$GITHUB_SHA" \
            --output artifacts/ci/plan-integrity.json \
            -- python scripts/verify_plan_integrity.py
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-ci-evidence
          path: artifacts/ci/*
          if-no-files-found: error
