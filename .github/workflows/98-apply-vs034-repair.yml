name: Apply VS-034 Repair
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    if: github.head_ref == 'agent/VS-034-model-benchmarks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply architecture and CI integration
        shell: python
        run: |
          import json
          from pathlib import Path

          policy_path = Path('docs/architecture/architecture-policy.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          name = 'BookStudio.Tests.ModelBenchmarks'
          if not any(item['name'] == name for item in policy['projects']):
              policy['projects'].append({
                  'name': name,
                  'projectPath': 'tests/BookStudio.Tests.ModelBenchmarks/BookStudio.Tests.ModelBenchmarks.csproj',
                  'layer': 'integration-test',
                  'outputAssemblyPath': 'tests/BookStudio.Tests.ModelBenchmarks/bin/Release/net10.0/BookStudio.Tests.ModelBenchmarks.dll',
                  'allowedProjectReferences': [
                      '../../src/BookStudio.Application/BookStudio.Application.csproj',
                      '../../src/BookStudio.OpenCode/BookStudio.OpenCode.csproj'
                  ],
                  'allowedBookStudioAssemblyReferences': [
                      'BookStudio.Application',
                      'BookStudio.OpenCode'
                  ],
                  'packagePolicy': 'none',
                  'agentsPath': 'tests/BookStudio.Tests.ModelBenchmarks/AGENTS.md',
                  'forbiddenNamespacePrefixes': []
              })
          policy_path.write_text(json.dumps(policy, indent=2) + '\n', encoding='utf-8')

          workflow_path = Path('.github/workflows/02-dotnet-ci.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          run_anchor = "      - name: Run agent tool profiles integration journey\n        run: dotnet run --project tests/BookStudio.Tests.AgentToolProfiles/BookStudio.Tests.AgentToolProfiles.csproj --no-build -c Release\n"
          run_block = run_anchor + "      - name: Run model benchmarks integration journey\n        run: dotnet run --project tests/BookStudio.Tests.ModelBenchmarks/BookStudio.Tests.ModelBenchmarks.csproj --no-build -c Release\n"
          if 'Run model benchmarks integration journey' not in workflow:
              workflow = workflow.replace(run_anchor, run_block)

          evidence_anchor = "      - name: Generate normalized agent tool profiles evidence\n        if: always()\n        run: python scripts/run_local_validation.py --provider local-evidence-default --contract dotnet.agent-tool-profiles-integration --source-sha \"${{ github.sha }}\" --output artifacts/ci/dotnet-agent-tool-profiles-integration.json -- dotnet run --project tests/BookStudio.Tests.AgentToolProfiles/BookStudio.Tests.AgentToolProfiles.csproj --no-build -c Release\n"
          evidence_block = evidence_anchor + "      - name: Generate normalized model benchmarks evidence\n        if: always()\n        run: python scripts/run_local_validation.py --provider local-evidence-default --contract dotnet.model-benchmarks-integration --source-sha \"${{ github.sha }}\" --output artifacts/ci/dotnet-model-benchmarks-integration.json -- dotnet run --project tests/BookStudio.Tests.ModelBenchmarks/BookStudio.Tests.ModelBenchmarks.csproj --no-build -c Release\n"
          if 'dotnet-model-benchmarks-integration.json' not in workflow:
              workflow = workflow.replace(evidence_anchor, evidence_block)
          workflow_path.write_text(workflow, encoding='utf-8')

          Path('.github/workflows/99-export-source.yml').unlink(missing_ok=True)
          Path('.github/workflows/98-apply-vs034-repair.yml').unlink(missing_ok=True)
      - name: Commit repair
        run: |
          git config user.name "bookstudio-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/architecture/architecture-policy.json .github/workflows/02-dotnet-ci.yml .github/workflows/98-apply-vs034-repair.yml .github/workflows/99-export-source.yml
          git commit -m "fix(VS-034): complete architecture and CI integration"
          git push origin HEAD:${{ github.head_ref }}
