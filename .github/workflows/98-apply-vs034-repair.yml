name: Apply VS-034 Architecture Repair
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    if: github.head_ref == 'agent/VS-034-model-benchmarks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply architecture integration
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path('docs/architecture/architecture-policy.json')
          policy = json.loads(path.read_text(encoding='utf-8'))
          name = 'BookStudio.Tests.ModelBenchmarks'
          if not any(item['name'] == name for item in policy['projects']):
              policy['projects'].append({
                  'name': name,
                  'projectPath': 'tests/BookStudio.Tests.ModelBenchmarks/BookStudio.Tests.ModelBenchmarks.csproj',
                  'layer': 'integration-test',
                  'outputAssemblyPath': 'tests/BookStudio.Tests.ModelBenchmarks/bin/Release/net10.0/BookStudio.Tests.ModelBenchmarks.dll',
                  'allowedProjectReferences': [
                      '../../src/BookStudio.Application/BookStudio.Application.csproj',
                      '../../src/BookStudio.OpenCode/BookStudio.OpenCode.csproj'
                  ],
                  'allowedBookStudioAssemblyReferences': [
                      'BookStudio.Application',
                      'BookStudio.OpenCode'
                  ],
                  'packagePolicy': 'none',
                  'agentsPath': 'tests/BookStudio.Tests.ModelBenchmarks/AGENTS.md',
                  'forbiddenNamespacePrefixes': []
              })
          path.write_text(json.dumps(policy, indent=2) + '\n', encoding='utf-8')
      - name: Commit architecture repair
        run: |
          git config user.name "bookstudio-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/architecture/architecture-policy.json
          git commit -m "fix(VS-034): register model benchmark architecture"
          git push origin HEAD:${{ github.head_ref }}
