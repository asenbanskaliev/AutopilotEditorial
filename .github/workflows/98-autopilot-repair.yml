name: Autopilot Repair
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    if: github.head_ref == 'agent/VS-034-model-benchmarks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Repair fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/BookStudio.Tests.ModelBenchmarks/ModelBenchmarksJourney.cs')
          text = path.read_text(encoding='utf-8')
          old = 'models[localIndex] = models[localIndex] with { ContextWindowTokens = 1_000 };'
          new = 'models[localIndex] = models[localIndex] with { ContextWindowTokens = 20_000 };'
          if old not in text:
              raise SystemExit('fixture not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "bookstudio-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add tests/BookStudio.Tests.ModelBenchmarks/ModelBenchmarksJourney.cs
          git commit -m "fix(VS-034): keep fallback fixture structurally valid"
          git push origin HEAD:${{ github.head_ref }}
