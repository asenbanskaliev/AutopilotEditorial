name: VS-030 Health Fact Fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/99-vs030-health-fact-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/VS-030-opencode-compatibility
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply tri-state health semantics and cumulative tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match in {path}, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          probe = Path("src/BookStudio.OpenCode/OpenCodeCompatibilityProbe.cs")
          replace_once(
              probe,
              "            BuildFacts(requestCount, state != OpenCodeCompatibilityStates.Unhealthy, openApiVersion));",
              "            BuildFacts(requestCount, ResolveHealthFact(state, version, orderedDetected), openApiVersion));",
          )
          replace_once(
              probe,
              "    private static IReadOnlyDictionary<string, string> BuildFacts(\n        int requestCount,\n        bool healthy,\n        string? openApiVersion)\n",
              "    private static bool? ResolveHealthFact(\n        string state,\n        string? version,\n        IReadOnlyList<string> detected)\n    {\n        if (state == OpenCodeCompatibilityStates.Unhealthy)\n        {\n            return false;\n        }\n        if (state == OpenCodeCompatibilityStates.Degraded)\n        {\n            return true;\n        }\n        if (state == OpenCodeCompatibilityStates.AuthenticationRequired &&\n            version is not null &&\n            detected.Contains(OpenCodeFeatureIds.Health, StringComparer.Ordinal))\n        {\n            return true;\n        }\n        return null;\n    }\n\n    private static IReadOnlyDictionary<string, string> BuildFacts(\n        int requestCount,\n        bool? healthy,\n        string? openApiVersion)\n",
          )
          replace_once(
              probe,
              '            ["healthy"] = healthy ? "true" : "false",',
              '            ["healthy"] = healthy switch\n            {\n                true => "true",\n                false => "false",\n                null => "unknown",\n            },',
          )

          journey = Path("tests/BookStudio.Tests.OpenCodeCompatibility/OpenCodeCompatibilityJourney.cs")
          inserts = [
              ('        Require(report.Facts["requests"] == "2", "Compatible probe request count drifted.");',
               '        Require(report.Facts["requests"] == "2", "Compatible probe request count drifted.");\n        Require(report.Facts["healthy"] == "true", "Compatible health fact drifted.");'),
              ('        Require(report.Code == "missing_required_features", "Missing feature code drifted.");',
               '        Require(report.Code == "missing_required_features", "Missing feature code drifted.");\n        Require(report.Facts["healthy"] == "true", "Degraded compatible-health fact drifted.");'),
              ('        Require(report.Code == "server_unhealthy", "Unhealthy server code drifted.");',
               '        Require(report.Code == "server_unhealthy", "Unhealthy server code drifted.");\n        Require(report.Facts["healthy"] == "false", "Unhealthy fact drifted.");'),
              ('        Require(report.Code == "authentication_required", "Unauthorized code drifted.");',
               '        Require(report.Code == "authentication_required", "Unauthorized code drifted.");\n        Require(report.Facts["healthy"] == "unknown", "Pre-health authentication fact must be unknown.");'),
              ('        Require(report.Code == "health_payload_invalid", "Malformed health code drifted.");',
               '        Require(report.Code == "health_payload_invalid", "Malformed health code drifted.");\n        Require(report.Facts["healthy"] == "unknown", "Malformed health fact must be unknown.");'),
              ('        Require(report.Code == "openapi_document_invalid", "Invalid OpenAPI code drifted.");',
               '        Require(report.Code == "openapi_document_invalid", "Invalid OpenAPI code drifted.");\n        Require(report.Facts["healthy"] == "true", "Post-health OpenAPI failure fact drifted.");'),
              ('        Require(report.Code == "request_timeout", "Timeout code drifted.");',
               '        Require(report.Code == "request_timeout", "Timeout code drifted.");\n        Require(report.Facts["healthy"] == "unknown", "Pre-health timeout fact must be unknown.");'),
          ]
          text = journey.read_text(encoding="utf-8")
          for old, new in inserts:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one journey assertion anchor: {old}")
              text = text.replace(old, new, 1)
          journey.write_text(text, encoding="utf-8")

          spec = Path("docs/specs/VS-030-opencode-compatibility.md")
          replace_once(
              spec,
              "- bounded evidence facts without endpoint credentials or response bodies.\n",
              "- bounded evidence facts without endpoint credentials or response bodies.\n\nThe `healthy` evidence fact is tri-state: `true` only after a valid `healthy=true` response, `false` only after a valid `healthy=false` response, and `unknown` when authentication, transport, status, bounds or payload validation prevents health determination.\n",
          )

          tcr = Path("docs/evidence/VS-030/TEST_CHANGE_REQUEST.md")
          text = tcr.read_text(encoding="utf-8")
          marker = "## TCR-030-002 — Health fact semantic correction"
          if marker not in text:
              text += """

## TCR-030-002 — Health fact semantic correction

### Trigger

Meta-review found that reports produced before a valid health payload used `healthy=true` because the helper inferred health from every state except `unhealthy`.

### Approved product and test change

- make the `healthy` fact tri-state: `true`, `false` or `unknown`;
- preserve `true` for degraded reports reached after a valid healthy response;
- preserve `false` only for a valid `healthy=false` response;
- use `unknown` for pre-health authentication, transport, timeout, status, bounds and malformed-health failures;
- add cumulative assertions to the real HTTP journey without removing any scenario.

### Test Auditor decision

**APPROVED** — this corrects an observable semantic contradiction and strengthens the evidence contract without changing endpoint discovery, request count, auth, bounds or feature detection.
"""
              tcr.write_text(text, encoding="utf-8")
          PY
      - name: Commit semantic correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/BookStudio.OpenCode/OpenCodeCompatibilityProbe.cs \
            tests/BookStudio.Tests.OpenCodeCompatibility/OpenCodeCompatibilityJourney.cs \
            docs/specs/VS-030-opencode-compatibility.md \
            docs/evidence/VS-030/TEST_CHANGE_REQUEST.md
          git commit -m "VS-030 correct tri-state health evidence"
          git push origin HEAD:agent/VS-030-opencode-compatibility
