name: VS-031 Architecture Registration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/99-vs031-register-architecture.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/VS-031-session-lifecycle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Register integration project exactly once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/architecture/architecture-policy.json")
          text = path.read_text(encoding="utf-8")
          name = '"name":"BookStudio.Tests.OpenCodeSessionLifecycle"'
          if name not in text:
              marker = "\n  ]\n}"
              if text.count(marker) != 1:
                  raise SystemExit(f"Expected one architecture array close, found {text.count(marker)}")
              project = '    {"name":"BookStudio.Tests.OpenCodeSessionLifecycle","projectPath":"tests/BookStudio.Tests.OpenCodeSessionLifecycle/BookStudio.Tests.OpenCodeSessionLifecycle.csproj","layer":"integration-test","outputAssemblyPath":"tests/BookStudio.Tests.OpenCodeSessionLifecycle/bin/Release/net10.0/BookStudio.Tests.OpenCodeSessionLifecycle.dll","allowedProjectReferences":["../../src/BookStudio.Application/BookStudio.Application.csproj","../../src/BookStudio.OpenCode/BookStudio.OpenCode.csproj"],"allowedBookStudioAssemblyReferences":["BookStudio.Application","BookStudio.OpenCode"],"packagePolicy":"none","agentsPath":"tests/BookStudio.Tests.OpenCodeSessionLifecycle/AGENTS.md","forbiddenNamespacePrefixes":[]}'
              path.write_text(text.replace(marker, ",\n" + project + marker, 1), encoding="utf-8")
          PY
      - name: Commit permanent architecture registration
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/architecture-policy.json
          git commit -m "VS-031 register session lifecycle architecture"
          git push origin HEAD:agent/VS-031-session-lifecycle
