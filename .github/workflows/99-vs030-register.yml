name: VS-030 Registration

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/99-vs030-register.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/VS-030-opencode-compatibility
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Register architecture and CI exactly once
        run: |
          python - <<'PY'
          from pathlib import Path

          architecture = Path("docs/architecture/architecture-policy.json")
          text = architecture.read_text(encoding="utf-8")
          if '"name":"BookStudio.Tests.OpenCodeCompatibility"' not in text:
              marker = "\n  ]\n}"
              if text.count(marker) != 1:
                  raise SystemExit(f"Expected one architecture array close, found {text.count(marker)}")
              project = '    {"name":"BookStudio.Tests.OpenCodeCompatibility","projectPath":"tests/BookStudio.Tests.OpenCodeCompatibility/BookStudio.Tests.OpenCodeCompatibility.csproj","layer":"integration-test","outputAssemblyPath":"tests/BookStudio.Tests.OpenCodeCompatibility/bin/Release/net10.0/BookStudio.Tests.OpenCodeCompatibility.dll","allowedProjectReferences":["../../src/BookStudio.Application/BookStudio.Application.csproj","../../src/BookStudio.OpenCode/BookStudio.OpenCode.csproj"],"allowedBookStudioAssemblyReferences":["BookStudio.Application","BookStudio.OpenCode"],"packagePolicy":"none","agentsPath":"tests/BookStudio.Tests.OpenCodeCompatibility/AGENTS.md","forbiddenNamespacePrefixes":[]}'
              text = text.replace(marker, ",\n" + project + marker, 1)
              architecture.write_text(text, encoding="utf-8")

          providers = Path("config/ci/providers.json")
          text = providers.read_text(encoding="utf-8")
          if '"id":"dotnet.opencode-compatibility-integration"' not in text:
              anchor = '    {"id":"dotnet.build-test"'
              if text.count(anchor) != 1:
                  raise SystemExit(f"Expected one provider insertion point, found {text.count(anchor)}")
              contract = '    {"id":"dotnet.opencode-compatibility-integration","capability":"integration","localEquivalentAllowed":true,"command":["dotnet","run","--project","tests/BookStudio.Tests.OpenCodeCompatibility/BookStudio.Tests.OpenCodeCompatibility.csproj","--no-build","-c","Release"]},\n'
              providers.write_text(text.replace(anchor, contract + anchor, 1), encoding="utf-8")

          workflow = Path(".github/workflows/02-dotnet-ci.yml")
          text = workflow.read_text(encoding="utf-8")
          if "Run OpenCode compatibility integration journey" not in text:
              anchor = '      - name: Generate normalized build evidence\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f"Expected one workflow run insertion point, found {text.count(anchor)}")
              step = '      - name: Run OpenCode compatibility integration journey\n        run: dotnet run --project tests/BookStudio.Tests.OpenCodeCompatibility/BookStudio.Tests.OpenCodeCompatibility.csproj --no-build -c Release\n'
              text = text.replace(anchor, step + anchor, 1)
          if "Generate normalized OpenCode compatibility evidence" not in text:
              anchor = '      - name: Upload .NET evidence\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f"Expected one workflow evidence insertion point, found {text.count(anchor)}")
              step = '      - name: Generate normalized OpenCode compatibility evidence\n        if: always()\n        run: python scripts/run_local_validation.py --provider local-evidence-default --contract dotnet.opencode-compatibility-integration --source-sha "${{ github.sha }}" --output artifacts/ci/dotnet-opencode-compatibility-integration.json -- dotnet run --project tests/BookStudio.Tests.OpenCodeCompatibility/BookStudio.Tests.OpenCodeCompatibility.csproj --no-build -c Release\n'
              text = text.replace(anchor, step + anchor, 1)
          workflow.write_text(text, encoding="utf-8")
          PY
      - name: Commit permanent registrations
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/architecture-policy.json config/ci/providers.json .github/workflows/02-dotnet-ci.yml
          git commit -m "VS-030 register compatibility architecture and CI"
          git push origin HEAD:agent/VS-030-opencode-compatibility
