name: KDP Official Policy Compliance

on:
  pull_request:
    paths:
      - "src/BookStudio.Autopilot/EditorialJourney/KdpPolicyCompliance.cs"
      - "src/BookStudio.Autopilot/EditorialJourney/KdpProductionPackage.cs"
      - "tests/BookStudio.Tests.KdpPolicyCompliance/**"
      - ".github/workflows/20-kdp-official-policy-compliance.yml"
      - "global.json"
      - "Directory.Packages.props"

permissions:
  contents: read

jobs:
  kdp-policy-compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore tests/BookStudio.Tests.KdpPolicyCompliance/BookStudio.Tests.KdpPolicyCompliance.csproj
      - name: Build
        run: dotnet build tests/BookStudio.Tests.KdpPolicyCompliance/BookStudio.Tests.KdpPolicyCompliance.csproj -c Release --no-restore
      - name: Enforce official KDP policy gate
        run: dotnet run --project tests/BookStudio.Tests.KdpPolicyCompliance/BookStudio.Tests.KdpPolicyCompliance.csproj -c Release --no-build
