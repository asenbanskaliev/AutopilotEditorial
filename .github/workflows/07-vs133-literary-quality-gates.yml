name: VS-133 Literary Quality Gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/BookStudio.Autopilot/**'
      - 'tests/BookStudio.Tests.LiteraryQuality/**'
      - '.github/workflows/07-vs133-literary-quality-gates.yml'
      - 'docs/vertical-slices/VS-133-professional-literary-quality-gates.md'
      - '.autopilot/AUTOPILOT_LOCK.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  literary-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore tests/BookStudio.Tests.LiteraryQuality/BookStudio.Tests.LiteraryQuality.csproj
      - run: dotnet build tests/BookStudio.Tests.LiteraryQuality/BookStudio.Tests.LiteraryQuality.csproj -c Release --no-restore
      - run: dotnet run --project tests/BookStudio.Tests.LiteraryQuality/BookStudio.Tests.LiteraryQuality.csproj -c Release --no-build
