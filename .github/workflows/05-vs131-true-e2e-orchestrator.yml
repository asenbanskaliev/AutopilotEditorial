name: VS-131 True E2E Orchestrator

on:
  pull_request:
    paths:
      - "src/BookStudio.Autopilot/**"
      - "tests/BookStudio.Tests.TrueE2EEditorialJourney/**"
      - ".github/workflows/05-vs131-true-e2e-orchestrator.yml"
      - "docs/vertical-slices/VS-131-true-e2e-orchestrator-live.md"
      - "Directory.Packages.props"
      - "global.json"

permissions:
  contents: read

jobs:
  true-e2e-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
      OPENCODE_VERSION: "1.15.5"
      RUNTIME: ${{ github.workspace }}/.runtime/vs131
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require masked live credential
        shell: bash
        run: |
          test -n "$OPENCODE_ZEN_API_KEY"
          test ${#OPENCODE_ZEN_API_KEY} -ge 12
          echo "::add-mask::$OPENCODE_ZEN_API_KEY"
      - name: Install pinned OpenCode ephemerally
        shell: bash
        run: |
          mkdir -p "$RUNTIME/opencode" "$RUNTIME/home" "$RUNTIME/config" "$RUNTIME/data" "$RUNTIME/cache" "$RUNTIME/publish"
          npm install --prefix "$RUNTIME/opencode" "opencode-ai@$OPENCODE_VERSION" --no-audit --no-fund
          "$RUNTIME/opencode/node_modules/.bin/opencode" --version | grep "$OPENCODE_VERSION"
      - name: Publish real MCP servers
        shell: bash
        run: |
          dotnet publish src/BookStudio.Mcp.Authoring/BookStudio.Mcp.Authoring.csproj -c Release -o "$RUNTIME/publish/authoring"
          dotnet publish src/BookStudio.Mcp.Quality/BookStudio.Mcp.Quality.csproj -c Release -o "$RUNTIME/publish/quality"
          dotnet publish src/BookStudio.Mcp.Production/BookStudio.Mcp.Production.csproj -c Release -o "$RUNTIME/publish/production"
      - name: Build true E2E runner
        run: dotnet build tests/BookStudio.Tests.TrueE2EEditorialJourney/BookStudio.Tests.TrueE2EEditorialJourney.csproj -c Release
      - name: Run actual production orchestrator live
        shell: bash
        env:
          HOME: ${{ env.RUNTIME }}/home
          XDG_CONFIG_HOME: ${{ env.RUNTIME }}/config
          XDG_DATA_HOME: ${{ env.RUNTIME }}/data
          XDG_CACHE_HOME: ${{ env.RUNTIME }}/cache
          OPENCODE_AUTH_CONTENT: ${{ format('{{"opencode":{{"type":"api","key":"{0}"}}}}', secrets.OPENCODE_ZEN_API_KEY) }}
          BOOKSTUDIO_REPO_ROOT: ${{ github.workspace }}
          BOOKSTUDIO_VS131_RUNTIME: ${{ env.RUNTIME }}/journey
          BOOKSTUDIO_OPENCODE: ${{ env.RUNTIME }}/opencode/node_modules/.bin/opencode
          BOOKSTUDIO_MCP_AUTHORING: ${{ env.RUNTIME }}/publish/authoring/BookStudio.Mcp.Authoring.dll
          BOOKSTUDIO_MCP_QUALITY: ${{ env.RUNTIME }}/publish/quality/BookStudio.Mcp.Quality.dll
          BOOKSTUDIO_MCP_PRODUCTION: ${{ env.RUNTIME }}/publish/production/BookStudio.Mcp.Production.dll
        run: dotnet run --project tests/BookStudio.Tests.TrueE2EEditorialJourney/BookStudio.Tests.TrueE2EEditorialJourney.csproj -c Release --no-build
      - name: Verify ephemeral credential and evidence
        if: always()
        shell: bash
        run: |
          test ! -f "$RUNTIME/data/opencode/auth.json"
          test -f artifacts/vs131/true-e2e-orchestrator.json
          ! grep -F "$OPENCODE_ZEN_API_KEY" artifacts/vs131/true-e2e-orchestrator.json
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vs131-true-e2e-orchestrator-evidence
          path: artifacts/vs131/true-e2e-orchestrator.json
          if-no-files-found: error
