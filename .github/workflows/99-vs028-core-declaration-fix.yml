name: VS-028 Core Declaration Fix

on:
  push:
    branches:
      - agent/VS-028-mcp-security-sandbox
    paths:
      - .github/workflows/99-vs028-core-declaration-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/VS-028-mcp-security-sandbox
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Insert missing declaration exactly once
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/BookStudio.Tests.BookCore/Program.cs")
          text = path.read_text(encoding="utf-8")
          anchor = "    string? cursor = null;\n    string? lastCursor = null;"
          replacement = "    var resourceUris = new List<string>();\n    string? cursor = null;\n    string? lastCursor = null;"
          if text.count(anchor) != 1:
              raise SystemExit(f"Expected one declaration anchor, found {text.count(anchor)}")
          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/BookStudio.Tests.BookCore/Program.cs
          git commit -m "VS-028 restore core resource collection declaration"
          git push origin HEAD:agent/VS-028-mcp-security-sandbox
