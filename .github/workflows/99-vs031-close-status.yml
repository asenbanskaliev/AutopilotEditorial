name: VS-031 Status Synchronization

# One-shot audited synchronization for the verified slice state.
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/99-vs031-close-status.yml

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/VS-031-session-lifecycle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize verified state exactly once
        run: |
          python - <<'PY'
          from pathlib import Path

          spec = Path("docs/specs/VS-031-session-lifecycle.md")
          text = spec.read_text(encoding="utf-8")
          old = "## Status\n\n`SPECIFICATION`"
          new = "## Status\n\n`VERIFIED`"
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit("VS-031 spec status anchor is ambiguous")
              spec.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("VS-031 spec status anchor is missing")

          execution = Path("docs/execution/EXECUTION_STATUS.md")
          execution.write_text("""# Execution Status

- Program version: 0.11.0
- Current phase: F3-OPENCODE
- Current slice: VS-031 — Session lifecycle
- State: VERIFIED
- Open PR: #43
- Blocking gate: final audited-head checks and merge
- Next action: validate the final audited head, merge PR #43 and activate VS-032 — SSE reconciliation
- Full program gate: NOT_READY
""", encoding="utf-8")

          status = Path("docs/execution/SLICE_STATUS.csv")
          text = status.read_text(encoding="utf-8")
          old = "VS-031;IN_PROGRESS;#42;;2026-07-27T16:45:00Z"
          new = "VS-031;VERIFIED;#42;#43;2026-07-27T17:22:00Z"
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit("VS-031 slice status anchor is ambiguous")
              status.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("VS-031 slice status anchor is missing")
          PY
      - name: Commit permanent verified state
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/specs/VS-031-session-lifecycle.md \
            docs/execution/EXECUTION_STATUS.md \
            docs/execution/SLICE_STATUS.csv
          git commit -m "VS-031 mark session lifecycle verified"
          git push origin HEAD:agent/VS-031-session-lifecycle
