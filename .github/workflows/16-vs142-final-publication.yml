name: VS-142 Final Download and Publication Journey
on:
  pull_request:
    paths:
      - 'src/BookStudio.Autopilot/EditorialJourney/FinalPublicationJourney.cs'
      - 'tests/BookStudio.Tests.FinalPublication/**'
      - '.github/workflows/16-vs142-final-publication.yml'
jobs:
  final-publication:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore tests/BookStudio.Tests.FinalPublication/BookStudio.Tests.FinalPublication.csproj
      - run: dotnet build tests/BookStudio.Tests.FinalPublication/BookStudio.Tests.FinalPublication.csproj -c Release --no-restore
      - run: dotnet run --project tests/BookStudio.Tests.FinalPublication/BookStudio.Tests.FinalPublication.csproj -c Release --no-build
