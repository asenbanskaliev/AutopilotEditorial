name: VS-134 KDP Production Package

on:
  pull_request:
    paths:
      - 'src/BookStudio.Autopilot/**'
      - 'tests/BookStudio.Tests.KdpPackage/**'
      - '.github/workflows/05-vs134-kdp-package.yml'
      - 'docs/vertical-slices/VS-134-kdp-production-package.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kdp-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore tests/BookStudio.Tests.KdpPackage/BookStudio.Tests.KdpPackage.csproj
      - run: dotnet build tests/BookStudio.Tests.KdpPackage/BookStudio.Tests.KdpPackage.csproj -c Release --no-restore
      - run: dotnet run --project tests/BookStudio.Tests.KdpPackage/BookStudio.Tests.KdpPackage.csproj -c Release --no-build
