name: Temporary Source Export
on:
  push:
    branches:
      - agent/VS-034-model-benchmarks
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        run: tar --exclude=.git -czf repository-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: repository-source
          path: repository-source.tar.gz
          retention-days: 1
