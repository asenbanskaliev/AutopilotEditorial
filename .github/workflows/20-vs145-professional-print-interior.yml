name: VS-145 Professional Print Interior

on:
  pull_request:
    paths:
      - "src/BookStudio.Autopilot/EditorialJourney/ProfessionalPrintInterior.cs"
      - "src/BookStudio.Autopilot/EditorialJourney/ProfessionalKdpProductionPackageBuilder.cs"
      - "tests/BookStudio.Tests.ProfessionalPrintInterior/**"
      - ".github/workflows/20-vs145-professional-print-interior.yml"
      - "global.json"
      - "Directory.Packages.props"

permissions:
  contents: read

jobs:
  professional-print-interior:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore tests/BookStudio.Tests.ProfessionalPrintInterior/BookStudio.Tests.ProfessionalPrintInterior.csproj
      - run: dotnet build tests/BookStudio.Tests.ProfessionalPrintInterior/BookStudio.Tests.ProfessionalPrintInterior.csproj -c Release --no-restore
      - run: dotnet run --project tests/BookStudio.Tests.ProfessionalPrintInterior/BookStudio.Tests.ProfessionalPrintInterior.csproj -c Release --no-build
