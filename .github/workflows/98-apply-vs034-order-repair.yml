name: Apply VS-034 Order Repair
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    if: github.head_ref == 'agent/VS-034-model-benchmarks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Preserve declared model order
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/BookStudio.Application/OpenCode/ModelBenchmarkCatalog.cs')
          text = path.read_text(encoding='utf-8')
          old = '''        var unique = new HashSet<string>(StringComparer.Ordinal);
        foreach (var source in values)
        {
            var value = ValidateIdentifier(source);
            if (!unique.Add(value) || (known is not null && !known.Contains(value)))
            {
                throw Invalid();
            }
        }
        return Array.AsReadOnly(unique.Order(StringComparer.Ordinal).ToArray());
'''
          new = '''        var unique = new HashSet<string>(StringComparer.Ordinal);
        var normalized = new List<string>(values.Count);
        foreach (var source in values)
        {
            var value = ValidateIdentifier(source);
            if (!unique.Add(value) || (known is not null && !known.Contains(value)))
            {
                throw Invalid();
            }
            normalized.Add(value);
        }
        return Array.AsReadOnly(normalized.ToArray());
'''
          if old not in text:
              raise SystemExit('Expected normalization block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "bookstudio-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add src/BookStudio.Application/OpenCode/ModelBenchmarkCatalog.cs
          git commit -m "fix(VS-034): preserve declared fallback order"
          git push origin HEAD:${{ github.head_ref }}
